[project]
name = "hero5-remote"
version = "0.1.0"
description = "Python remote control interface for GoPro Hero 5 Black via Wi-Fi HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Leonardo Bora"}]
keywords = ["gopro", "hero5", "wifi", "remote", "camera"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
hero5-remote = "hero5_remote.cli:main"

[project.urls]
Homepage = "https://github.com/leonardobora/hero5-remote"
Repository = "https://github.com/leonardobora/hero5-remote"
Issues = "https://github.com/leonardobora/hero5-remote/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hero5_remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
